# HOME input in degrees: [0, -60, 0, 0, 180, 30, 0]. Stored in radians.
home_joints_rad: [0.0, -1.0471975511965976, 0.0, 0.0, 3.141592653589793, 0.5235987755982988, 0.0]
# Fixed box release: xArm base TCP position in mm. No tactile Z descent.
place_object_xyz_mm: [600.0, -300.0, 300.0]
# After reaching XYZ, descend this distance in Z before opening.
place_descend_mm: 100.0

# Workspace in xArm base coordinates (meters).
workspace_bounds_m:
  x: [0.3, 0.9]
  y: [-0.5, 0.5]
  # TCP height limits: 80 to 800 mm in xArm base coordinates.
  z: [0.08, 0.8]

approach_offset_mm: [0.0, 0.0, 0.0]
backoff_x_mm: 100.0
